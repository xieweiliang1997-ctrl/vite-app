# nginx.conf
server {
    listen 80;
    server_name localhost;  # 容器内的域名（外部访问通过宿主机 IP:端口）
    root /usr/share/nginx/html;  # 静态资源目录（与 Dockerfile 中复制的目录一致）
    index index.html;  # 默认首页

    # 解决 Vue/React 路由刷新 404 问题（History 模式）
    location / {
        try_files $uri $uri/ /index.html;  # 所有请求转发到 index.html，由前端路由处理
    }

    # 解决跨域问题（如果前端需要调用后端接口，可配置 Nginx 反向代理）
    location /api {  # 前端请求前缀为 /api 的接口
        proxy_pass http://backend-container:8080;  # 后端服务地址（替换为实际后端 IP:端口）
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        rewrite ^/api/(.*)$ /$1 break;
    }

    # 静态资源缓存配置（优化性能）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 7d;  # 缓存 7 天
        add_header Cache-Control "public, max-age=604800";
    }
}